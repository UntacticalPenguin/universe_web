name: Build data and deploy to GitHub Pages

# Downloads Gaia data, builds the star files and, once pipeline/build_octree.py
# exists, the octree tiles; then builds the viewer and publishes it. Data never
# goes into git.
#
# Each downloaded slice is also stored as an asset of the GitHub release named in
# RAW_RELEASE, so it survives cache expiry and Gaia archive downtime. Where a slice
# comes from, in order: the Actions cache, that release, the Gaia archive.
# Change RAW_RELEASE whenever fetch_gaia.py's columns change.
#
# Run it by hand from the Actions tab ("Run workflow") to choose other slices.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      slices:
        description: "Gaia G-magnitude slices as min:max, separated by spaces"
        required: false
        default: "-5:10 10:11 11:12 12:12.5 12.5:13"

permissions:
  contents: write # store raw Gaia slices as release assets
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SLICES: ${{ inputs.slices || '-5:10 10:11 11:12 12:12.5 12.5:13' }}
  RAW_RELEASE: gaia-dr3-raw-v2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt

      - name: Restore downloaded Gaia slices
        uses: actions/cache@v4
        with:
          path: pipeline/data/raw
          key: gaia-raw-${{ env.RAW_RELEASE }}-${{ env.SLICES }}

      - name: Get Gaia slices (cache, then release, then archive)
        continue-on-error: true
        working-directory: pipeline
        env:
          GAIA_USER: ${{ secrets.GAIA_USER }}
          GAIA_PASSWORD: ${{ secrets.GAIA_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p data/raw
          account=yes
          if [ -z "$GAIA_USER" ] || [ -z "$GAIA_PASSWORD" ]; then account=no; fi
          release=yes
          gh release view "$RAW_RELEASE" >/dev/null 2>&1 || release=no
          failed=""
          for s in $SLICES; do
            gmin="${s%%:*}"; gmax="${s##*:}"
            name="$(python fetch_gaia.py --gmin="$gmin" --gmax="$gmax" --print-name)"
            if [ -f "data/raw/$name" ]; then echo "cache: $name"; continue; fi
            if [ "$release" = yes ] && gh release download "$RAW_RELEASE" --pattern "$name" --dir data/raw 2>/dev/null; then
              echo "release: $name"; continue
            fi
            if [ "$account" = no ]; then failed="$failed $s"; continue; fi
            if python fetch_gaia.py --gmin="$gmin" --gmax="$gmax"; then
              if [ "$release" = no ]; then
                gh release create "$RAW_RELEASE" --title "Raw Gaia DR3 slices ($RAW_RELEASE)" --latest=false \
                  --notes "Parquet slices written by pipeline/fetch_gaia.py, stored by deploy.yml. Not a software release." && release=yes
              fi
              gh release upload "$RAW_RELEASE" "data/raw/$name" --clobber || echo "::warning::could not store $name in release $RAW_RELEASE"
            else
              failed="$failed $s"
            fi
          done
          if [ -n "$failed" ]; then
            if [ "$account" = no ]; then
              echo "::warning title=No Gaia account::Slices$failed are neither cached nor in release $RAW_RELEASE. Add the repository secrets GAIA_USER and GAIA_PASSWORD (Settings → Secrets and variables → Actions); anonymous archive jobs stop after 1 minute and 50,000 rows."
            else
              echo "::warning title=Gaia slices failed::$failed. Check this step's log; the other slices were used."
            fi
          fi

      - name: Build star files and tiles
        working-directory: pipeline
        run: |
          if ls data/raw/*.parquet >/dev/null 2>&1; then
            python prepare.py data/raw/*.parquet --limit 1000000 --out ../viewer/public/data/stars-1m.bin
            python prepare.py data/raw/*.parquet --limit 3000000 --out ../viewer/public/data/stars-3m.bin
            python prepare.py data/raw/*.parquet --limit 6000000 --out ../viewer/public/data/stars-6m.bin
            python prepare.py data/raw/*.parquet --limit 1000000
            if [ -f build_octree.py ]; then
              python build_octree.py data/raw/*.parquet --limit 6000000 --out ../viewer/public/tiles/stars
            fi
            {
              echo "## Star files"
              for f in ../viewer/public/data/stars-*.json; do echo "### $(basename "$f")"; echo '```json'; cat "$f"; echo '```'; done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No Gaia data was downloaded; deploying the bundled sample stars only."
          fi

      - name: Restore OGLE-III Large Magellanic Cloud tiles
        id: ogle-cache
        uses: actions/cache@v4
        with:
          path: viewer/public/tiles/lmc
          key: ogle-lmc-6m-${{ hashFiles('pipeline/build_lmc.py', 'pipeline/build_octree.py', 'pipeline/prepare.py') }}
      - name: Build six million OGLE-III LMC-field entries
        # External archive: if it is down, deploy without this layer; the viewer hides missing layers.
        continue-on-error: true
        if: steps.ogle-cache.outputs.cache-hit != 'true'
        working-directory: pipeline
        run: python build_lmc.py --out ../viewer/public/tiles/lmc

      - name: Restore deeper Gaia preview
        id: deep-cache
        uses: actions/cache@v4
        with:
          path: |
            viewer/public/tiles/deep
            viewer/public/tiles/deep-wide
          key: deep-gaia-v1-${{ hashFiles('pipeline/build_deep_gaia.py', 'pipeline/build_octree.py', 'pipeline/prepare.py') }}
      - name: Build deeper Gaia preview
        # External archive: if it is down, deploy without this layer; the viewer hides missing layers.
        continue-on-error: true
        if: steps.deep-cache.outputs.cache-hit != 'true'
        working-directory: pipeline
        run: python build_deep_gaia.py --out ../viewer/public/tiles

      - name: Restore full-sky luminous Gaia selection
        id: luminous-cache
        uses: actions/cache@v4
        with:
          path: viewer/public/tiles/luminous
          key: luminous-gaia-v1-${{ hashFiles('pipeline/build_luminous.py', 'pipeline/build_octree.py', 'pipeline/prepare.py') }}
          # Fall back to the last good selection when the archive is down (closed 25 Nov - 2 Dec 2026).
          restore-keys: luminous-gaia-v1-
      - name: Select luminous Gaia sources across the full distance catalog
        # External archive: if it is down, deploy without this layer; the viewer hides missing layers.
        continue-on-error: true
        if: steps.luminous-cache.outputs.cache-hit != 'true'
        working-directory: pipeline
        run: |
          if [ -f ../viewer/public/tiles/luminous/hierarchy.json ] && ! curl -sf -m 20 -o /dev/null https://gea.esac.esa.int/tap-server/tap/availability; then
            echo "Archive unreachable; keeping the restored luminous layer."; exit 0
          fi
          python build_luminous.py --out ../viewer/public/tiles/luminous.new
          rm -rf ../viewer/public/tiles/luminous && mv ../viewer/public/tiles/luminous.new ../viewer/public/tiles/luminous

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run build
        working-directory: viewer

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
