<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>universe map</title>
    <style>
      :root {
        color-scheme: dark;
        /* White ink in five steps on black; orange only for what is changing right now. Star colours are the data's own. */
        --bg: #000;
        --ink: #fff;
        --ink-2: rgb(255 255 255 / 0.64);
        --ink-3: rgb(255 255 255 / 0.4);
        --ink-4: rgb(255 255 255 / 0.22);
        --ink-5: rgb(255 255 255 / 0.1);
        --hot: #ff5a1f;
        --hair: 1px;
        --stroke: 1.5px;
        --text-size: 11px;
        --hud-size: 10px;
        --numeral-size: 9px;
        --tray-height: 18px;
        --knob: 11px;
        --gap: 8px;
        --fast: 120ms;
        --rail-width: 220px;
        background: var(--bg);
        color: var(--ink);
        font:
          var(--text-size) "JetBrains Mono Variable",
          ui-monospace,
          monospace;
        -webkit-font-smoothing: antialiased;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      #sky {
        position: fixed;
        inset: 0;
        canvas {
          display: block;
          touch-action: none;
        }
      }
      html[data-cursor="custom"] #sky canvas {
        cursor: none;
      }
      /* Distance ruler: a row per decade, a meter of loaded stars per row, landmarks. Drag along it to set the camera's distance. */
      #rail {
        position: fixed;
        top: 0;
        left: 0;
        bottom: var(--tray-height);
        width: var(--rail-width);
        height: calc(100% - var(--tray-height));
        background: linear-gradient(to right, var(--bg) 55%, transparent);
        cursor: ns-resize;
        user-select: none;
        touch-action: none;
        text {
          font-size: var(--numeral-size);
          font-variant-numeric: tabular-nums;
          fill: var(--ink-4);
        }
        .label {
          fill: var(--ink-3);
        }
        line {
          stroke-width: var(--hair);
        }
        .spine,
        .minor {
          stroke: var(--ink-5);
        }
        .major,
        .landmark-tick {
          stroke: var(--ink-4);
        }
        .meter rect {
          fill: var(--ink-5);
          &.on {
            fill: var(--ink-3);
          }
        }
        .extent {
          fill: none;
          stroke: var(--ink-3);
          stroke-width: var(--hair);
        }
        .marker line {
          stroke: var(--ink);
          stroke-width: var(--stroke);
        }
        &[data-live] .marker line {
          stroke: var(--hot);
        }
      }
      /* The orbit target: a ring and its name. */
      #target {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        &::before {
          content: "";
          position: absolute;
          inset: -7px auto auto -7px;
          width: 12px;
          height: 12px;
          border: var(--hair) solid var(--ink-2);
          border-radius: 50%;
        }
        span {
          position: absolute;
          left: 12px;
          top: -7px;
          white-space: nowrap;
          font-size: var(--hud-size);
          line-height: 14px;
          color: var(--ink-2);
        }
      }
      /* The hand: hairlines edge to edge leaving a 12px gap at the point, brackets on the nearest star, its readout. */
      #cursor {
        --x: -1000px;
        --y: -1000px;
        --line: var(--ink-5);
        --mark: var(--ink-2);
        position: fixed;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        pointer-events: none;
        &[data-live] {
          --line: rgb(255 90 31 / 0.3);
          --mark: var(--hot);
        }
        .hairline {
          position: absolute;
          top: 0;
          left: 0;
        }
        .vertical {
          bottom: 0;
          width: 1px;
          translate: var(--x) 0;
          background: linear-gradient(to bottom, var(--line) calc(var(--y) - 6px), transparent 0 calc(var(--y) + 6px), var(--line) 0);
        }
        .horizontal {
          right: 0;
          height: 1px;
          translate: 0 var(--y);
          background: linear-gradient(to right, var(--line) calc(var(--x) - 6px), transparent 0 calc(var(--x) + 6px), var(--line) 0);
        }
        .marks {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
          .corners {
            fill: none;
            stroke: var(--mark);
            stroke-width: var(--hair);
          }
        }
        .readout {
          position: absolute;
          top: 0;
          left: 0;
          padding: 0 3px;
          background: var(--bg);
          white-space: nowrap;
          font-size: var(--numeral-size);
          line-height: 12px;
          color: var(--ink-3);
          b {
            font-weight: inherit;
            color: var(--ink);
          }
          &:empty {
            display: none;
          }
        }
      }
      .knob {
        --fill: 0;
        width: var(--knob);
        height: var(--knob);
        margin-right: 0.75ch;
        padding: 0;
        vertical-align: -2px;
        border: var(--hair) solid var(--ink-2);
        border-radius: 50%;
        background: conic-gradient(var(--ink-2) calc(var(--fill) * 1turn), transparent 0);
        cursor: ns-resize;
        touch-action: none;
        transition: border-color var(--fast);
        &:hover,
        &:focus-visible {
          border-color: var(--ink);
          outline: none;
        }
        &[data-dragging] {
          border-color: var(--hot);
          background: conic-gradient(var(--hot) calc(var(--fill) * 1turn), transparent 0);
        }
      }
      /* Polybar-style readings in one centred row, a hairline between every field. */
      #tray {
        position: fixed;
        inset: auto 0 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: var(--tray-height);
        border-top: var(--hair) solid var(--ink-5);
        background: var(--bg);
        color: var(--ink-3);
        font-size: var(--numeral-size);
        line-height: var(--tray-height);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        .zone {
          display: flex;
          & + .zone {
            border-left: var(--hair) solid var(--ink-5);
          }
        }
        [data-field] {
          display: flex;
          align-items: center;
          padding-inline: var(--gap);
          & + [data-field] {
            border-left: var(--hair) solid var(--ink-5);
          }
        }
        abbr {
          margin-right: 0.5ch;
          text-decoration: none;
          cursor: help;
        }
        b {
          display: inline-block;
          font-weight: inherit;
          color: var(--ink);
        }
        small {
          margin-left: 0.5ch;
          font-size: inherit;
          color: var(--ink-3);
        }
        [data-field="target"] b {
          width: 12ch;
        }
        [data-field="distance"] b {
          width: 9ch;
        }
        [data-field="loaded"] b,
        [data-field="visible"] b {
          width: 9ch;
        }
        [data-field="mag"] b,
        [data-field="exposure"] b,
        [data-field="fps"] b,
        [data-field="draw"] b {
          width: 4ch;
        }
        [data-field][hidden] {
          display: none;
        }
        &[data-rendering] [data-field="fps"] b {
          color: var(--hot);
        }
        .brand {
          padding-inline: var(--gap);
          color: var(--ink-2);
        }
      }
      #exposure-mode,
      #home {
        padding: 0 var(--gap);
        border: none;
        border-left: var(--hair) solid var(--ink-5);
        background: none;
        color: var(--ink-2);
        font: inherit;
        cursor: pointer;
        &:hover,
        &:focus-visible {
          color: var(--ink);
          outline: none;
        }
      }
      #error {
        position: fixed;
        top: var(--gap);
        right: var(--gap);
        color: var(--hot);
        &:empty {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="sky"></div>
    <svg id="rail" aria-label="distance scale: drag to set the camera's distance from its target"></svg>
    <div id="target" aria-hidden="true"><span></span></div>
    <div id="cursor" aria-hidden="true" hidden></div>
    <footer id="tray">
      <span class="zone"><span class="brand">universe map</span></span>
      <span class="zone">
        <span data-field="target"><abbr title="orbit target">◎</abbr><b>sun</b></span>
        <span data-field="distance"><abbr title="camera distance to the target">↔</abbr><b>—</b></span>
      </span>
      <span class="zone">
        <span data-field="loaded"><abbr title="stars loaded">★</abbr><b>—</b></span>
        <span data-field="visible"><abbr title="stars bright enough to draw from here; counted once the view is still">◐</abbr><b>—</b></span>
      </span>
      <span class="zone">
        <span data-field="mag"
          ><button id="mag-knob" class="knob" type="button" aria-label="magnitude limit"></button
          ><abbr title="draw stars brighter than this magnitude, or all stars">mag</abbr><b id="mag-value"></b
        ></span>
        <span data-field="exposure"
          ><button id="exposure-knob" class="knob" type="button" aria-label="exposure in stops"></button><abbr title="exposure offset in stops">exp</abbr
          ><b id="exposure-value"></b
        ></span>
      </span>
      <span class="zone">
        <button id="exposure-mode" type="button" aria-label="Automatic exposure" aria-pressed="true">auto</button>
        <span data-field="fps"><abbr title="frames drawn in the last second; idle while nothing changes">fps</abbr><b>—</b></span>
        <span data-field="draw" hidden><abbr title="median time to draw one frame, GPU included (benchmark mode)">draw ms</abbr><b>—</b></span>
      </span>
      <button id="home" type="button">⌂ sun</button>
    </footer>
    <output id="error"></output>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
