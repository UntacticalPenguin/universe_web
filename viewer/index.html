<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>universe map</title>
    <style>
      :root {
        color-scheme: dark;
        /* White ink in five steps on black; orange only for what is changing right now. Star colours are the data's own. */
        --bg: #000;
        --ink: #fff;
        --ink-2: rgb(255 255 255 / 0.64);
        --ink-3: rgb(255 255 255 / 0.4);
        --ink-4: rgb(255 255 255 / 0.22);
        --ink-5: rgb(255 255 255 / 0.1);
        --hot: #ff5a1f;
        --hair: 1px;
        --stroke: 1.5px;
        --text-size: 11px;
        --hud-size: 10px;
        --numeral-size: 9px;
        --tray-height: 18px;
        --knob: 11px;
        --gap: 8px;
        --fast: 120ms;
        --rail-width: 220px;
        background: var(--bg);
        color: var(--ink);
        font:
          var(--text-size) "JetBrains Mono Variable",
          ui-monospace,
          monospace;
        -webkit-font-smoothing: antialiased;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      #sky {
        position: fixed;
        inset: 0;
        canvas {
          display: block;
          touch-action: none;
        }
      }
      html[data-cursor="custom"] #sky canvas {
        cursor: none;
      }
      /* Distance ruler: a row per decade, a meter of loaded stars per row, landmarks. Drag along it to set the camera's distance. */
      #rail {
        position: fixed;
        top: 0;
        left: 0;
        bottom: var(--tray-height);
        width: var(--rail-width);
        height: calc(100% - var(--tray-height));
        background: linear-gradient(to right, var(--bg) 55%, transparent);
        cursor: ns-resize;
        user-select: none;
        touch-action: none;
        text {
          font-size: var(--numeral-size);
          font-variant-numeric: tabular-nums;
          fill: var(--ink-4);
        }
        .label {
          fill: var(--ink-3);
        }
        line {
          stroke-width: var(--hair);
        }
        .spine,
        .minor {
          stroke: var(--ink-5);
        }
        .major,
        .landmark-tick {
          stroke: var(--ink-4);
        }
        .meter rect {
          fill: var(--ink-5);
          &.on {
            fill: var(--ink-3);
          }
        }
        .extent {
          fill: none;
          stroke: var(--ink-3);
          stroke-width: var(--hair);
        }
        .marker line {
          stroke: var(--ink);
          stroke-width: var(--stroke);
        }
        &[data-live] .marker line {
          stroke: var(--hot);
        }
      }
      /* The orbit target: a ring and its name. */
      #target {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        &::before {
          content: "";
          position: absolute;
          inset: -7px auto auto -7px;
          width: 12px;
          height: 12px;
          border: var(--hair) solid var(--ink-2);
          border-radius: 50%;
        }
        span {
          position: absolute;
          left: 12px;
          top: -7px;
          white-space: nowrap;
          font-size: var(--hud-size);
          line-height: 14px;
          color: var(--ink-2);
        }
      }
      /* The hand: hairlines edge to edge leaving a 12px gap at the point, brackets on the nearest star, its readout. */
      #cursor {
        --x: -1000px;
        --y: -1000px;
        --line: var(--ink-5);
        --mark: var(--ink-2);
        position: fixed;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        pointer-events: none;
        &[data-live] {
          --line: rgb(255 90 31 / 0.3);
          --mark: var(--hot);
        }
        .hairline {
          position: absolute;
          top: 0;
          left: 0;
        }
        .vertical {
          bottom: 0;
          width: 1px;
          translate: var(--x) 0;
          background: linear-gradient(to bottom, var(--line) calc(var(--y) - 6px), transparent 0 calc(var(--y) + 6px), var(--line) 0);
        }
        .horizontal {
          right: 0;
          height: 1px;
          translate: 0 var(--y);
          background: linear-gradient(to right, var(--line) calc(var(--x) - 6px), transparent 0 calc(var(--x) + 6px), var(--line) 0);
        }
        .marks {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
          .corners {
            fill: none;
            stroke: var(--mark);
            stroke-width: var(--hair);
          }
        }
        .readout {
          position: absolute;
          top: 0;
          left: 0;
          padding: 0 3px;
          background: var(--bg);
          white-space: nowrap;
          font-size: var(--numeral-size);
          line-height: 12px;
          color: var(--ink-3);
          b {
            font-weight: inherit;
            color: var(--ink);
          }
          &:empty {
            display: none;
          }
        }
      }
      /* Polybar-style readings in one centred row, a hairline between every field. */
      #tray {
        position: fixed;
        inset: auto 0 0;
        display: flex;
        justify-content: safe center;
        overflow-x: auto;
        align-items: center;
        height: var(--tray-height);
        border-top: var(--hair) solid var(--ink-5);
        background: var(--bg);
        color: var(--ink-3);
        font-size: var(--numeral-size);
        line-height: var(--tray-height);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        .zone {
          display: flex;
          & + .zone {
            border-left: var(--hair) solid var(--ink-5);
          }
        }
        [data-field] {
          display: flex;
          align-items: center;
          padding-inline: var(--gap);
          & + [data-field] {
            border-left: var(--hair) solid var(--ink-5);
          }
        }
        abbr {
          margin-right: 0.5ch;
          text-decoration: none;
          cursor: help;
        }
        b {
          display: inline-block;
          font-weight: inherit;
          color: var(--ink);
        }
        small {
          margin-left: 0.5ch;
          font-size: inherit;
          color: var(--ink-3);
        }
        [data-field="target"] b {
          width: 12ch;
        }
        [data-field="distance"] b {
          width: 9ch;
        }
        [data-field="loaded"] b,
        [data-field="visible"] b {
          width: 9ch;
        }
        [data-field="mag"] b,
        [data-field="exposure"] b,
        [data-field="fps"] b,
        [data-field="draw"] b {
          width: 4ch;
        }
        [data-field][hidden] {
          display: none;
        }
        &[data-rendering] [data-field="fps"] b {
          color: var(--hot);
        }
        .brand {
          padding-inline: var(--gap);
          color: var(--ink-2);
        }
      }
      #dust,
      #spikes,
      #controls {
        position: fixed;
        z-index: 11;
        right: 12px;
        top: 12px;
        width: min(264px, calc(100vw - 24px));
        background: var(--bg);
        border: 1px solid var(--ink-4);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      #controls header {
        display: grid;
        grid-template-columns: 1fr 90px;
      }
      #controls button,
      #controls select {
        font: inherit;
        color: var(--ink-2);
        background: var(--bg);
        border: 1px solid var(--ink-4);
        cursor: pointer;
        min-height: 34px;
      }
      #controls button:hover,
      #controls select:hover,
      #controls :focus-visible {
        color: var(--ink);
        border-color: var(--ink);
        outline: 1px solid var(--ink-2);
      }
      #controls button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }
      #controls button:active {
        color: var(--hot);
      }
      #controls header button {
        border: 0;
        text-align: left;
        padding: 0 12px;
      }
      #controls #home {
        border-left: 1px solid var(--ink-4);
        text-align: center;
      }
      #drawer-toggle::before {
        content: "▸";
        display: inline-block;
        width: 2ch;
      }
      #drawer-toggle[aria-expanded="true"]::before {
        content: "▾";
      }
      #controls-body {
        max-height: calc(100dvh - 80px);
        overflow-y: auto;
        border-top: 1px solid var(--ink-4);
        padding: 0 12px 8px;
        scrollbar-gutter: stable;
      }
      #controls h2 {
        font: inherit;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin: 12px 0 5px;
      }
      #controls label,
      .switch-row {
        display: grid;
        grid-template-columns: 1fr 92px;
        align-items: center;
        min-height: 38px;
        border-top: 1px solid var(--ink-5);
      }
      #controls select {
        padding-inline: 8px;
        width: 100%;
      }
      #controls .mode-note {
        height: 16px;
        margin: 0;
        font-size: 10px;
        color: var(--ink-2);
      }
      #controls .mode-note[hidden] {
        display: block;
        visibility: hidden;
      }
      .orbit-pad {
        display: grid;
        grid-template-columns: 40px 96px 40px;
        grid-template-rows: 32px 96px 32px;
        justify-content: center;
        align-items: center;
      }
      #orbit-globe {
        grid-area: 2/2;
        width: 96px;
        height: 96px;
        cursor: grab;
        touch-action: none;
        fill: none;
        stroke: var(--ink-4);
      }
      #orbit-globe:active {
        cursor: grabbing;
        stroke: var(--hot);
      }
      #orbit-globe circle {
        stroke: var(--ink-2);
      }
      .orbit-pad button {
        justify-self: center;
        width: 36px;
      }
      #controls .hint {
        color: var(--ink-2);
        font-size: 10px;
        line-height: 1.5;
        margin: 4px 0 8px;
      }
      #error:not(:empty) {
        z-index: 12;
        background: var(--bg);
      }
      @media (max-width: 640px) {
        #controls {
          right: 5px;
          top: 5px;
        }
        #rail {
          max-width: 30vw;
        }
      }
      #error {
        position: fixed;
        top: var(--gap);
        right: var(--gap);
        color: var(--hot);
        &:empty {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="sky"></div>
    <svg id="rail" aria-label="distance scale: drag to set the camera's distance from its target"></svg>
    <div id="target" aria-hidden="true"><span></span></div>
    <div id="cursor" aria-hidden="true" hidden></div>
    <aside id="controls" aria-label="Viewer controls">
      <header>
        <button id="drawer-toggle" aria-expanded="true" aria-controls="controls-body">Controls</button
        ><button id="home" aria-pressed="false" title="Return to the Sun. Toggle again to restore your view.">☉ Sun</button>
      </header>
      <div id="controls-body">
        <h2>Orbit</h2>
        <div class="orbit-pad">
          <svg id="orbit-globe" viewBox="0 0 100 100" role="group" tabindex="0" aria-label="Orbit globe. Drag or use the arrow keys to rotate around the focus">
            <circle cx="50" cy="50" r="40" />
            <path />
            <circle cx="50" cy="50" r="1.5" />
          </svg>
          <button data-orbit="0,1" style="grid-area: 1/2" aria-pressed="false" aria-label="Orbit up" title="Toggle orbit up">↑</button>
          <button data-orbit="-1,0" style="grid-area: 2/1" aria-pressed="false" aria-label="Orbit left" title="Toggle orbit left">←</button>
          <button data-orbit="1,0" style="grid-area: 2/3" aria-pressed="false" aria-label="Orbit right" title="Toggle orbit right">→</button>
          <button data-orbit="0,-1" style="grid-area: 3/2" aria-pressed="false" aria-label="Orbit down" title="Toggle orbit down">↓</button>
        </div>
        <p class="hint">Click a star to focus. Drag the globe, or toggle an arrow for continuous orbit.</p>
        <label
          >Rotation speed<select id="rotation-speed">
            <option value=".25">¼×</option>
            <option value=".5">½×</option>
            <option selected value="1">1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select></label
        >
        <h2>Starlight</h2>
        <label>Magnitude limit<select id="mag-value"></select></label>
        <label>Exposure offset<select id="exposure-value"></select></label>
        <label>Saturation<select id="sat-value"></select></label>
        <p class="mode-note" id="enhanced" hidden>enhanced</p>
        <label>Glow<select id="glow-value"></select></label>
        <div class="switch-row"><span>Metering</span><button id="exposure-mode" aria-label="Metering" aria-pressed="true">auto</button></div>
        <div class="switch-row"><span>Galactic dust</span><button id="dust" aria-label="Galactic dust" aria-pressed="true">dust on</button></div>
        <p class="mode-note" id="dust-status" hidden></p>
        <div class="switch-row"><span>Diffraction</span><button id="spikes" aria-label="Diffraction" aria-pressed="false">spikes off</button></div>
      </div>
    </aside>
    <footer id="tray">
      <span class="zone"><span class="brand">universe map</span></span>
      <span class="zone">
        <span data-field="target"><abbr title="orbit target">◎</abbr><b>sun</b></span>
        <span data-field="distance"><abbr title="camera distance to the target">↔</abbr><b>—</b></span>
      </span>
      <span class="zone">
        <span data-field="loaded"><abbr title="stars loaded">★</abbr><b>—</b></span>
        <span data-field="visible"><abbr title="stars bright enough to draw from here; counted once the view is still">◐</abbr><b>—</b></span>
      </span>
      <span class="zone">
        <span data-field="fps"><abbr title="frames drawn in the last second; idle while nothing changes">fps</abbr><b>—</b></span>
        <span data-field="draw" hidden><abbr title="median time to draw one frame, GPU included (benchmark mode)">draw ms</abbr><b>—</b></span>
      </span>
    </footer>
    <output id="error"></output>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
